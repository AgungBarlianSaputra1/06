<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Render DRY Modular</title>
    <style>
        body {
            font-family: Arial;
        }

        h2 {
            text-align: center;
        }

        /* TABLE */
        table {
            border-collapse: collapse;
            width: 60%;
            margin: 20px auto;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: green;
            color: white;
        }

        /* LIST */
        ul {
            width: 60%;
            margin: 20px auto;
        }

        li {
            padding: 8px;
            border-bottom: 1px solid #ccc;
        }

        /* CARD */
        .card-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            border: 1px solid #ccc;
            padding: 15px;
            width: 150px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<h2>TABLE</h2>
<table>
    <thead id="table-head"></thead>
    <tbody id="table-body"></tbody>
</table>

<h2>LIST (2 Data)</h2>
<ul id="list"></ul>

<h2>CARD (2 Data)</h2>
<div class="card-container" id="card"></div>

<script>
/* =====================
   DATA (SCALABLE)
===================== */
const data = [
    { id: 1, nama: "Andi" },
    { id: 2, nama: "Budi" },
    { id: 3, nama: "Citra" },
    { id: 4, nama: "Dina" }
];

/* =====================
   CONFIG (REUSE)
===================== */
const columns = [
    { key: "id", label: "ID" },
    { key: "nama", label: "Nama" }
];

/* =====================
   CREATE ELEMENT (DRY)
===================== */
function createHeader(cols) {
    return `<tr>${cols.map(c => `<th>${c.label}</th>`).join("")}</tr>`;
}

function createRow(item, cols) {
    return `<tr>${cols.map(c => `<td>${item[c.key]}</td>`).join("")}</tr>`;
}

function createListItem(item) {
    return `<li>${item.id} - ${item.nama}</li>`;
}

function createCard(item) {
    return `
        <div class="card">
            <h3>${item.nama}</h3>
            <p>ID: ${item.id}</p>
        </div>
    `;
}

/* =====================
   RENDER (MODULAR)
===================== */
function renderTable(data, cols) {
    document.getElementById("table-head").innerHTML = createHeader(cols);
    document.getElementById("table-body").innerHTML =
        data.map(d => createRow(d, cols)).join("");
}

function renderList(data) {
    // ambil 2 data pertama
    document.getElementById("list").innerHTML =
        data.slice(0,2).map(d => createListItem(d)).join("");
}

function renderCard(data) {
    // ambil 2 data pertama
    document.getElementById("card").innerHTML =
        data.slice(0,2).map(d => createCard(d)).join("");
}

/* =====================
   INIT (RENDER LOGIC)
===================== */
renderTable(data, columns);
renderList(data);
renderCard(data);

</script>

</body>
</html>
```
